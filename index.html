<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1766ad"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
:root{--b:#1766ad;--sky:#eaf6ff;--gold:#f5bd45;--green:#16865a;--red:#c33c4a;--gray:#738394}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(160deg,#e0f4ff,#fffaf0);color:#17324d;min-height:100vh}main{max-width:620px;margin:auto;padding:18px 14px 50px}.brand{text-align:center}.brand h1{color:var(--b);margin:6px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 28px #164b7220;margin:14px 0}button{border:0;border-radius:13px;font-weight:750}.scan{width:100%;padding:15px;background:var(--b);color:#fff;font-size:17px}.manual{display:flex;gap:8px;margin-top:12px}.manual input{min-width:0;flex:1;padding:13px;border:1px solid #cbd9e5;border-radius:12px}.manual button{background:var(--gold);padding:0 15px}.hidden{display:none!important}.error{color:var(--red);text-align:center;font-weight:700}.pill{display:inline-block;background:var(--sky);padding:6px 9px;margin:3px;border-radius:999px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.stats div{background:var(--sky);padding:10px 3px;border-radius:13px;font-size:12px}.stats b{display:block;color:var(--b);font-size:21px}.bar{height:12px;background:#e6edf3;border-radius:8px;margin-top:12px;overflow:hidden}.bar i{display:block;background:var(--green);height:100%}.cat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef1f4}.calendar-head{display:flex;align-items:center;justify-content:space-between}.calendar-head button{background:var(--sky);color:var(--b);font-size:20px;padding:6px 12px}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week span{text-align:center;color:var(--gray);font-size:11px;padding:8px 0}.day{min-height:67px;border:1px solid #e5edf3;border-radius:10px;padding:5px;font-size:12px;background:#fff}.day.off{opacity:.35}.day.today{border:2px solid var(--b)}.event{font-size:9px;padding:3px;border-radius:6px;margin-top:3px;line-height:1.1}.asistio{background:#dcf5e8;color:#087345}.falta{background:#ffe3e5;color:#a72435}.pendiente{background:#fff0c8;color:#8a6410}.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;margin-top:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px}.loader{text-align:center}.updated{text-align:center;color:var(--gray);font-size:12px}#reader{margin-top:12px;border:0!important}h2{color:var(--b);margin:0 0 8px}@media(max-width:390px){.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:60px;padding:3px}.event{font-size:8px}}
</style></head><body><main><div class="brand"><div style="font-size:34px">✝️</div><h1>CATEKIDS</h1><p>Calendario de asistencias</p></div><section class="card"><button class="scan" id="scan">📷 Escanear mi tarjeta QR</button><div id="reader" class="hidden"></div><div class="manual"><input id="code" placeholder="Código de la tarjeta"><button id="go">Consultar</button></div><p id="error" class="error"></p></section><div id="loading" class="card loader hidden">Consultando registros reales…</div><section id="result" class="hidden"><div class="card"><h2 id="name"></h2><div id="meta"></div><p id="saint"></p></div><div class="card"><div class="stats"><div><b id="yes"></b>Asistencias</div><div><b id="no"></b>Faltas</div><div><b id="wait"></b>Pendientes</div><div><b id="pct"></b>Cumplimiento</div></div><div class="bar"><i id="bar"></i></div></div><div class="card"><h3>Resumen</h3><div id="cats"></div></div><div class="card"><div class="calendar-head"><button id="prev">‹</button><h3 id="month"></h3><button id="next">›</button></div><div class="week"><span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span></div><div id="calendar" class="calendar"></div><div class="legend"><span><i class="dot" style="background:#55c98d"></i>Asistió</span><span><i class="dot" style="background:#ed6973"></i>Falta</span><span><i class="dot" style="background:#efc04e"></i>Pendiente</span></div><p id="updated" class="updated"></p></div></section>
<script>const API_URL='https://script.google.com/macros/s/AKfycbwn9Kg5n2Pe23bGtT-f0hJCFVCmr3ybPOdcUCy4RYpY_3Qf6gjtuhSX8D2B7o2B_OJ0/exec';let report=null,viewDate=new Date(),scanner=null;const $=x=>document.getElementById(x);$('go').onclick=()=>lookup($('code').value);$('code').onkeydown=e=>{if(e.key==='Enter')lookup(e.target.value)};$('scan').onclick=startScan;$('prev').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);drawCalendar()};$('next').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);drawCalendar()};
function startScan(){if(typeof Html5Qrcode==='undefined')return showError('No se cargó el lector QR. Revisa tu conexión.');$('reader').classList.remove('hidden');if(scanner)scanner.clear().catch(()=>{});scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},text=>{scanner.stop();$('reader').classList.add('hidden');$('code').value=text;lookup(text)},()=>{}).catch(()=>showError('No se pudo abrir la cámara. Autoriza el permiso de cámara en Chrome.'))}
function lookup(code){code=(code||'').trim();if(!code)return showError('Escanea o escribe un código.');if(!API_URL.startsWith('https://script.google.com/'))return showError('Falta configurar la URL de Apps Script en index.html.');$('error').textContent='';$('result').classList.add('hidden');$('loading').classList.remove('hidden');const cb='catekids_'+Date.now();window[cb]=p=>{delete window[cb];s.remove();$('loading').classList.add('hidden');p.ok?render(p.data):showError(p.error)};const s=document.createElement('script');s.onerror=()=>{delete window[cb];$('loading').classList.add('hidden');showError('No fue posible conectar con la hoja.');s.remove()};s.src=API_URL+'?action=report&callback='+cb+'&code='+encodeURIComponent(code);document.body.appendChild(s)}
function render(r){report=r;viewDate=new Date(r.hoy+'T12:00:00');$('result').classList.remove('hidden');$('name').textContent=r.nombre;$('meta').innerHTML=`<span class="pill">${esc(r.curso)}</span><span class="pill">${esc(r.grupo)}</span><span class="pill">Catequista: ${esc(r.catequista)}</span>`;$('saint').textContent=r.santo?'Grupo: '+r.santo:'';$('yes').textContent=r.asistencias;$('no').textContent=r.faltas;$('wait').textContent=r.pendientes;$('pct').textContent=r.porcentaje+'%';$('bar').style.width=Math.min(100,r.porcentaje)+'%';$('cats').innerHTML=r.categorias.map(c=>`<div class="cat"><span>${esc(c.tipo)}</span><span><b>${c.asistencias}</b> asistió · <b>${c.faltas}</b> faltó · ${c.pendientes} pendiente</span></div>`).join('');$('updated').textContent='Actualizado: '+r.actualizado;drawCalendar()}
function drawCalendar(){if(!report)return;const y=viewDate.getFullYear(),m=viewDate.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),names=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];$('month').textContent=names[m].toUpperCase()+' '+y;let h='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=localIso(d),ev=report.calendario.filter(x=>x.iso===iso);h+=`<div class="day ${d.getMonth()!==m?'off':''} ${iso===report.hoy?'today':''}"><b>${d.getDate()}</b>${ev.map(x=>`<div class="event ${x.estado}">${short(x.tipo)} · ${label(x.estado)}</div>`).join('')}</div>`}$('calendar').innerHTML=h}function short(t){return t==='Misa dominical'?'Misa':t==='Hora Santa'?'H. Santa':'Solemne'}function label(s){return s==='asistio'?'✓':s==='falta'?'✕':'…'}function localIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function showError(t){$('error').textContent=t;$('loading').classList.add('hidden')}</script></main></body></html>
